name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

      - name: Check uv lockfile is current
        run: uv lock --check

  test:
    runs-on: ubuntu-latest
    # The next release is an early warning, not a gate — it usually breaks on
    # missing wheels for transitive C extensions. See CONTRIBUTING.md.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      # Without this, one failing leg cancels the others and hides whether the
      # failure is version-specific.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - python-version: "3.15"
            experimental: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests with coverage
        run: |
          uv run pytest tests/ -v \
            --cov=skills \
            --cov=scripts \
            --cov-report=term-missing \
            --cov-fail-under=80

  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Validate skill structure
        run: uv run python scripts/validate_skill.py skills/*

  skillsaw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: stbenjam/skillsaw@ac135381fc46711e7615e30b7296e857bb20b645 # v0
        with:
          strict: true

  test-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Test skill execution
        run: |
          # Test each skill has valid syntax, --help works, and check command exists
          for skill in skills/*/; do
            skill_script=$(find "$skill/scripts" -name "*.py" -not -name "__init__.py" | head -1)
            if [ -n "$skill_script" ]; then
              echo "Testing $skill_script"
              uv run python "$skill_script" --help
              uv run python "$skill_script" check || true  # May fail if not configured, that's ok
            fi
          done
