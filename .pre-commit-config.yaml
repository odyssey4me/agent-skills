# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  # Ruff - Fast Python linter and formatter.
  # Run through `uv run` rather than ruff-pre-commit so the version comes from
  # uv.lock — the same resolution CI uses. A separately pinned hook rev drifts
  # from the lockfile and lets pre-commit pass while CI fails.
  - repo: local
    hooks:
      # Run the linter
      - id: ruff
        name: ruff lint
        entry: uv run --extra dev ruff check --fix
        language: system
        types_or: [python, pyi]
        stages: [pre-commit]
      # Run the formatter
      - id: ruff-format
        name: ruff format
        entry: uv run --extra dev ruff format
        language: system
        types_or: [python, pyi]
        stages: [pre-commit]
      # Pre-push: strict checks matching CI (no auto-fix, whole tree)
      - id: ruff-check-prepush
        name: ruff check (pre-push)
        entry: uv run --extra dev ruff check .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: ruff-format-prepush
        name: ruff format check (pre-push)
        entry: uv run --extra dev ruff format --check .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  # Skillsaw - Agent skill linter
  - repo: https://github.com/stbenjam/skillsaw
    rev: v0.14.0
    hooks:
      - id: skillsaw
        args: [--strict]
        stages: [pre-commit]

  # Validate skill structure before commit
  - repo: local
    hooks:
      - id: validate-skills
        name: validate skill structure
        entry: uv run --extra dev python scripts/validate_skill.py
        language: system
        files: ^skills/.*/SKILL\.md$
        pass_filenames: false
        args: [skills/*]
        stages: [pre-commit]

      - id: uv-lock-check
        name: uv lockfile current
        entry: uv lock --check
        language: system
        files: ^pyproject\.toml$
        pass_filenames: false
        stages: [pre-commit]

      # Also enforced by a Claude Code hook, but that only covers commits Claude
      # makes — this covers every commit, whoever makes it.
      - id: skill-versions
        name: skill versions bumped
        entry: scripts/check_versions.sh
        language: system
        files: ^skills/
        pass_filenames: false
        stages: [pre-commit]

      - id: diff-cover
        name: coverage for changed lines
        entry: bash -c 'uv run --extra dev pytest tests/ -q --cov=skills --cov=scripts --cov-report=xml:coverage.xml && uv run --extra dev diff-cover coverage.xml --compare-branch=HEAD --fail-under=80'
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-commit]

  # Run full CI checks before push
  - repo: https://github.com/stbenjam/skillsaw
    rev: v0.14.0
    hooks:
      - id: skillsaw
        alias: skillsaw-prepush
        name: skillsaw (pre-push)
        args: [--strict]
        stages: [pre-push]
        always_run: true

  - repo: local
    hooks:
      - id: validate-skills-prepush
        name: validate skill structure (pre-push)
        entry: uv run --extra dev python scripts/validate_skill.py
        language: system
        pass_filenames: false
        args: [skills/*]
        stages: [pre-push]
        always_run: true

      - id: pytest-coverage
        name: pytest (full test suite with coverage)
        entry: uv run --extra dev pytest
        language: system
        pass_filenames: false
        args: [tests/, -v, --cov=skills, --cov=scripts, --cov-report=term-missing, --cov-fail-under=80]
        stages: [pre-push]
        always_run: true

      # .python-version pins the default (3.14, the newest supported). This
      # covers the other end of the CI matrix; without it, breakage on the
      # oldest supported Python is CI-first.
      - id: pytest-py311
        name: pytest (oldest supported Python)
        entry: uv run --extra dev --python 3.11 pytest
        language: system
        pass_filenames: false
        args: [tests/, -q]
        stages: [pre-push]
        always_run: true


# Default stages (can be overridden per hook)
default_stages: [pre-commit]

# Fail fast - stop on first failure
fail_fast: false
